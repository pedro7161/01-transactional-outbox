quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://postgres:5432/orderdb}

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.debezium-outbox.table-name=outbox_event
quarkus.debezium-outbox.payload.column-definition=TEXT NOT NULL
quarkus.debezium-outbox.remove-after-insert=false

quarkus.log.category."dev.pedro.outbox.order".level=INFO
