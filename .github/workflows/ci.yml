name: CI

# The end-to-end suite provisions Docker infrastructure; opt in when dispatching.
on:
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run the transactional-outbox end-to-end suite after unit tests pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, package, and run normal tests
        run: mvn -B --no-transfer-progress verify

  end-to-end-integration:
    if: inputs.run_integration
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Docker availability
        run: |
          docker --version
          docker compose version
      - name: Run transactional outbox end-to-end test
        run: mvn -B --no-transfer-progress verify -Pintegration
