services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderdb
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    volumes:
      - ../infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 2s
      timeout: 5s
      retries: 30

  kafka:
    image: quay.io/debezium/kafka:3.6.1.Final
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      NODE_ID: 1
      NODE_ROLE: combined
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30

  connect:
    image: quay.io/debezium/connect:3.6.1.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: outbox-e2e-connect-cluster
      CONFIG_STORAGE_TOPIC: outbox_e2e_connect_configs
      OFFSET_STORAGE_TOPIC: outbox_e2e_connect_offsets
      STATUS_STORAGE_TOPIC: outbox_e2e_connect_statuses
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: ..
      dockerfile: integration-tests/docker/order-service.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: ..
      dockerfile: integration-tests/docker/inventory-service.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventorydb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
